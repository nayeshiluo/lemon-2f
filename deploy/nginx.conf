server {
    listen 80;
    server_name localhost;

    # Align the reverse-proxy request ceiling with the backend's default
    # UPLOAD_MAX_FILE_SIZE_MB=10240 (10 GiB). The backend still enforces
    # the authoritative per-user and per-file limits.
    client_max_body_size 10240m;
    client_body_timeout 3600s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Stream large uploads to FastAPI instead of buffering the entire
        # request body on the nginx container filesystem first.
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
