name: Lemon 2F CI / Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: lemon-2f-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: lemon_2f_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock.txt
          pip check

      - name: Bytecode Compilation Check
        run: |
          python -m compileall backend

      - name: Run Alembic Migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/lemon_2f_test
          APP_ENV: testing
          SECRET_KEY: strong-ci-test-secret-key-32chars-minimum-safe
        run: |
          alembic upgrade head
          alembic check

      - name: Run Automated Test Suite against PostgreSQL & Redis
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/lemon_2f_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
          SECRET_KEY: strong-ci-test-secret-key-32chars-minimum-safe
        run: |
          PYTHONPATH=. pytest tests/ -v

      - name: Validate Docker Compose Configuration
        env:
          POSTGRES_PASSWORD: ci-compose-password
        run: |
          docker compose config --quiet

      - name: Build Backend Container Image
        run: |
          docker build -f backend/Dockerfile -t lemon-2f-backend:ci .

      - name: Validate Nginx Configuration
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
